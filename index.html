
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saumyadip Jana | Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c0e0f'/><text x='50' y='70' font-family='sans-serif' font-size='65' font-weight='500' fill='%237fa9ff' text-anchor='middle'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#0c0e0f',
              surface: '#111416',
              'surface-hover': '#171a1c',
              border: '#292e31',
              'text-main': '#eef0f1',
              'text-muted': '#a5adb3',
              'text-subtle': '#79838a',
              accent: '#7fa9ff',
            },
            fontFamily: {
              main: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0c0e0f;
        color: #eef0f1;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }

      .highlight { 
        color: #a9c5ff;
        background: rgba(127, 169, 255, 0.1);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.9em; 
        font-family: 'JetBrains Mono', monospace; 
      }

      a, button, input, textarea {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid #7fa9ff;
        outline-offset: 3px;
      }

      ::selection {
        color: #0c0e0f;
        background: #7fa9ff;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0c0e0f;
      }
      ::-webkit-scrollbar-thumb {
        background: #292e31;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #41494e;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
